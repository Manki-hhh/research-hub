<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>研究总台 · 商品与产业链</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --text:#1f2329; --muted:#6b7280; --border:#e5e7eb;
    --accent:#1f2329; --red:#c62828;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;}
  .wrap{max-width:900px;margin:0 auto;padding:0 20px 60px;}

  /* 顶部品牌栏 */
  header{display:flex;align-items:center;justify-content:space-between;
         padding:20px 0;border-bottom:1px solid var(--border);margin-bottom:56px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .logo{width:38px;height:38px;border-radius:10px;background:var(--accent);color:#fff;
        display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;}
  .brand h1{margin:0;font-size:17px;letter-spacing:.3px;}
  .brand .en{font-size:10px;color:var(--muted);letter-spacing:1.5px;margin-top:2px;}
  .header-link{font-size:12px;color:var(--muted);text-decoration:none;border:1px solid var(--border);
               padding:7px 12px;border-radius:20px;background:#fff;}
  .header-link:hover{border-color:var(--accent);color:var(--text);}

  /* Hero */
  .hero{margin-bottom:32px;}
  .hero h2{font-size:34px;margin:0 0 10px;letter-spacing:-.5px;font-weight:750;}
  .hero p{color:var(--muted);font-size:14px;margin:0;line-height:1.8;}

  /* 搜索框 */
  .search-wrap{position:relative;margin:28px 0 20px;}
  .search-wrap input{width:100%;padding:15px 44px 15px 46px;font-size:15px;
    border:1px solid var(--border);border-radius:12px;background:#fff;outline:none;
    box-shadow:0 1px 3px rgba(0,0,0,.03);transition:border-color .2s,box-shadow .2s;}
  .search-wrap input:focus{border-color:#9ca3af;box-shadow:0 4px 16px rgba(0,0,0,.06);}
  .search-wrap .icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);
    font-size:19px;color:#9ca3af;}
  .search-wrap .clear{position:absolute;right:14px;top:50%;transform:translateY(-50%);
    color:#9ca3af;cursor:pointer;font-size:18px;display:none;user-select:none;}

  /* 分类标签 */
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px;}
  .chip{border:1px solid var(--border);background:#fff;color:var(--muted);
    padding:7px 15px;border-radius:18px;font-size:12px;cursor:pointer;transition:.15s;}
  .chip:hover{border-color:#9ca3af;}
  .chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}

  /* 区块标题 */
  .section-title{font-size:13px;color:var(--muted);margin:0 0 14px;font-weight:600;}

  /* 入口卡片 */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
  .entry{background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:20px;text-decoration:none;color:inherit;display:block;
    transition:transform .15s,box-shadow .15s,border-color .15s;}
  .entry:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.07);border-color:#c7cbd1;}
  .entry-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .entry-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;
    justify-content:center;font-size:17px;background:#fff3e0;color:#e65100;}
  .entry-tag{font-size:11px;color:var(--muted);border:1px solid var(--border);
    padding:3px 9px;border-radius:12px;}
  .entry h3{font-size:16px;margin:0 0 8px;}
  .entry p{font-size:12px;color:var(--muted);line-height:1.7;margin:0 0 16px;min-height:40px;}
  .entry-meta{font-size:11px;color:#9ca3af;border-top:1px solid #f0f1f3;padding-top:12px;
    display:flex;justify-content:space-between;}

  .empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:14px;display:none;}
  .empty .big{font-size:36px;color:#d1d5db;margin-bottom:12px;}

  footer{margin-top:64px;padding-top:20px;border-top:1px solid var(--border);
    font-size:12px;color:#9ca3af;text-align:center;line-height:1.8;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">研</div>
      <div>
        <h1>研究总台</h1>
        <div class="en">COMMODITY &amp; INDUSTRY RESEARCH</div>
      </div>
    </div>
    <a class="header-link" href="#about">关于</a>
  </header>

  <section class="hero">
    <h2>找研究，直接搜。</h2>
    <p>价格、库存、财报、产业链趋势 —— 一个入口直达。</p>
  </section>

  <div class="search-wrap">
    <span class="icon">⌕</span>
    <input type="text" id="search" placeholder="搜索研究入口，例如「钨」「库存」「财报」" autocomplete="off">
    <span class="clear" id="clear">×</span>
  </div>

  <div class="chips" id="chips">
    <div class="chip active" data-cat="全部">全部</div>
    <div class="chip" data-cat="产业链">产业链</div>
    <div class="chip" data-cat="价格">价格</div>
    <div class="chip" data-cat="库存">库存</div>
    <div class="chip" data-cat="财报">财报</div>
  </div>

  <div class="section-title" id="countLabel">全部入口 · 1</div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">
    <div class="big">⌕</div>
    没有找到相关入口<br>换个关键词试试，例如「钨」「库存」或「财报」
  </div>

  <footer id="about">
    研究总台 · 持续更新中 · 内容仅供研究参考，不构成投资建议
  </footer>
</div>

<script>
const ENTRIES = [
  {
    title: "钨产业链趋势跟踪",
    desc: "厦门钨业、中钨高新股价与黑钨精矿价格走势，叠加财报节点、扣非净利润与百川工厂库存。",
    tags: ["产业链", "价格", "库存", "财报"],
    tagLabel: "产业链",
    icon: "钨",
    iconBg: "#fff3e0", iconColor: "#e65100",
    href: "report.html",
    updated: "2026-11-27",
    type: "交互报告"
  }
];

const grid = document.getElementById('grid');
const search = document.getElementById('search');
const clear = document.getElementById('clear');
const empty = document.getElementById('empty');
const countLabel = document.getElementById('countLabel');
let activeCat = '全部';

function render(){
  const q = search.value.trim().toLowerCase();
  const list = ENTRIES.filter(e=>{
    const catOk = activeCat==='全部' || e.tags.includes(activeCat);
    const hay = (e.title+' '+e.desc+' '+e.tags.join(' ')).toLowerCase();
    return catOk && hay.includes(q);
  });
  grid.innerHTML = list.map(e=>`
    <a class="entry" href="${e.href}">
      <div class="entry-top">
        <div class="entry-icon" style="background:${e.iconBg};color:${e.iconColor}">${e.icon}</div>
        <span class="entry-tag">${e.tagLabel}</span>
      </div>
      <h3>${e.title}</h3>
      <p>${e.desc}</p>
      <div class="entry-meta"><span>${e.type}</span><span>更新 ${e.updated}</span></div>
    </a>
  `).join('');
  empty.style.display = list.length ? 'none' : 'block';
  grid.style.display = list.length ? 'grid' : 'none';
  countLabel.textContent = (activeCat==='全部'?'全部入口':activeCat) + ' · ' + list.length;
  clear.style.display = q ? 'block' : 'none';
}

document.querySelectorAll('#chips .chip').forEach(c=>{
  c.onclick = ()=>{
    document.querySelectorAll('#chips .chip').forEach(x=>x.classList.remove('active'));
    c.classList.add('active');
    activeCat = c.dataset.cat;
    render();
  };
});
search.addEventListener('input', render);
clear.onclick = ()=>{ search.value=''; render(); search.focus(); };
render();
</script>
</body>
</html>
